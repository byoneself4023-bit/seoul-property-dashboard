<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 부동산 거래량 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4">

<!-- ─────────────────────────────────────────────
  1. 헤더
───────────────────────────────────────────── -->
<header class="max-w-6xl mx-auto mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3">
  <div>
    <h1 class="text-xl font-bold tracking-tight">서울시 25개구 주택 거래량 대시보드</h1>
    <p id="headerDate" class="text-slate-500 text-xs mt-0.5">데이터 수집일: —</p>
  </div>
  <div class="flex items-center gap-2">
    <!-- 주간/월간 토글 (버튼 2개) -->
    <div class="flex bg-white border border-slate-200 rounded-lg p-0.5 gap-0.5">
      <button id="btnWeek" onclick="setGranularity('week')"
        class="px-3 py-1.5 rounded-md text-sm font-semibold transition-colors bg-indigo-600 text-white">주간</button>
      <button id="btnMonth" onclick="setGranularity('month')"
        class="px-3 py-1.5 rounded-md text-sm font-semibold transition-colors text-slate-600 hover:text-slate-900">월간</button>
    </div>
    <span id="dataBadge" title="비아파트=연립다세대+단독다가구+오피스텔(준주택)" class="text-xs bg-white border border-slate-300 text-slate-600 px-2 py-1 rounded font-medium">목데이터</span>
  </div>
</header>

<!-- ─────────────────────────────────────────────
  2. KPI 카드 (선택 구 기준)
───────────────────────────────────────────── -->
<section class="max-w-6xl mx-auto mb-4 grid grid-cols-2 gap-3">
  <div class="bg-white shadow-sm border border-slate-200 rounded-xl p-4">
    <p class="text-slate-500 text-xs mb-1"><span id="kpiDistrictLabel">—</span> 아파트 거래</p>
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-bold text-slate-900" id="kpiApt">—</span>
      <span class="text-slate-500 text-xs">건</span>
    </div>
    <p class="text-xs mt-1 font-semibold" id="kpiAptDelta">—</p>
  </div>
  <div class="bg-white shadow-sm border border-slate-200 rounded-xl p-4">
    <p class="text-slate-500 text-xs mb-1"><span id="kpiDistrictLabel2">—</span> 비아파트 거래</p>
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-bold text-indigo-600" id="kpiNon">—</span>
      <span class="text-slate-500 text-xs">건</span>
    </div>
    <p class="text-xs mt-1 font-semibold" id="kpiNonDelta">—</p>
  </div>
</section>

<!-- ─────────────────────────────────────────────
  3. 타임라인 슬라이더 + 자동재생
───────────────────────────────────────────── -->
<section class="max-w-6xl mx-auto mb-4 bg-white shadow-sm border border-slate-200 rounded-xl p-4">
  <div class="flex flex-wrap items-center gap-2">
    <button id="btnPrev" onclick="navigate(-1)" aria-label="이전 기간"
      class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 disabled:opacity-30 disabled:cursor-not-allowed rounded-lg text-sm font-semibold transition-colors text-slate-700">
      &#8592; 이전
    </button>
    <span id="periodLabel" aria-live="polite" class="text-sm font-bold text-indigo-600 min-w-36 text-center">—</span>
    <button id="btnNext" onclick="navigate(+1)" aria-label="다음 기간"
      class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 disabled:opacity-30 disabled:cursor-not-allowed rounded-lg text-sm font-semibold transition-colors text-slate-700">
      다음 &#8594;
    </button>
    <input type="range" id="timeSlider" min="0" max="11" value="11"
      aria-label="기간 선택"
      class="flex-1 min-w-24 h-2 accent-indigo-600 cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-400 rounded">
    <button id="playBtn" onclick="toggleAutoplay()" aria-pressed="false"
      class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-white rounded-lg text-xs font-bold transition-colors">
      <span id="playIcon" aria-hidden="true">&#9654;</span>
      <span id="playText">재생</span>
    </button>
  </div>
</section>

<!-- ─────────────────────────────────────────────
  4. 격자형 카토그램 지도
───────────────────────────────────────────── -->
<section class="max-w-6xl mx-auto mb-4 bg-white shadow-sm border border-slate-200 rounded-xl p-4">
  <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
    <p class="text-xs font-semibold text-slate-700">서울시 거래 활성도 지형도 <span class="text-slate-400 font-normal">(셀 클릭 또는 Enter/Space → 구 선택)</span></p>
    <div class="flex gap-3 text-xs" aria-label="색상 범례">
      <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded bg-indigo-600" aria-hidden="true"></span><span class="text-slate-600">상위 8구</span></span>
      <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded bg-indigo-200" aria-hidden="true"></span><span class="text-slate-600">중위</span></span>
      <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded bg-slate-100 border border-slate-200" aria-hidden="true"></span><span class="text-slate-600">하위</span></span>
    </div>
  </div>
  <div class="grid gap-1.5" id="cartogramMap" role="group" aria-label="서울시 25개구 카토그램" style="grid-template-columns: repeat(8, 1fr);"></div>
</section>

<!-- ─────────────────────────────────────────────
  4-B. 구별 거래량 바 차트 (현재 기간, 전체 25구)
───────────────────────────────────────────── -->
<section class="max-w-6xl mx-auto mb-4 bg-white shadow-sm border border-slate-200 rounded-xl p-4">
  <p class="text-xs font-semibold text-slate-700 mb-2">구별 거래량 (현재 기간) <span class="text-slate-400 font-normal">· 바 클릭 → 구 선택 · 카토그램(공간) + 막대(수량) 상호 보완</span></p>
  <div style="position:relative;height:200px;max-height:200px;">
    <canvas id="barChart"></canvas>
  </div>
</section>

<!-- ─────────────────────────────────────────────
  5. 선택 구 분석: 3모드 차트 + 분석 코멘터리
───────────────────────────────────────────── -->
<section class="max-w-6xl mx-auto mb-4 bg-white shadow-sm border border-slate-200 rounded-xl p-4">
  <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
    <p class="text-sm font-bold text-slate-800">분석: <span id="chartDistrictTitle" class="text-indigo-600">—</span></p>
    <div class="flex gap-1" role="tablist" aria-label="차트 모드 선택">
      <button id="chartTab-trend" role="tab" aria-selected="true" onclick="switchChartMode('trend')"
        class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400">거래추이</button>
      <button id="chartTab-room" role="tab" aria-selected="false" onclick="switchChartMode('room')"
        class="px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400">공간규격별</button>
      <button id="chartTab-price" role="tab" aria-selected="false" onclick="switchChartMode('price')"
        class="px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400">금액대별</button>
    </div>
  </div>
  <!-- 차트 컨테이너: 3모드 모두 동일 높이 (320px), overflow 방지 -->
  <div style="position:relative;height:320px;max-height:320px;">
    <canvas id="districtChart"></canvas>
  </div>
  <!-- 분석 코멘터리 -->
  <div class="mt-3 pt-3 border-t border-slate-100">
    <p class="text-xs text-slate-600 leading-relaxed" id="commentary" aria-live="polite">—</p>
  </div>
</section>

//  공개 메서드 계약: getPeriods / getDistrictTotals /
//                   getDistrictTrend / getSeoulTotals
// ════════════════════════════════════════════════
const dataProvider = (() => {

  // ── 목데이터 생성 헬퍼 ─────────────────────────

  // 월별 사이클 멀티플라이어 (인덱스 0 = 가장 오래된 달)
  // 아파트: 완만히 감소 0.90→0.85, 비아파트: 완만히 상승 0.95→1.00
  function _monthMultiplier(idx) {
    const t = idx / 11; // 0..1
    return {
      apt:    0.90 - t * 0.05,
      nonApt: 0.95 + t * 0.05
    };
  }

  // 결정론적 주별 변동 (Math.sin 기반, 난수 없음)
  function _weekVariation(idx) {
    return 1 + Math.sin(idx) * 0.06;
  }

  // 12개월 기간 키 배열 생성 (오래된 순, 가장 최근 = 지난 완료 월)
  // 진행 중인 당월(부분 집계)은 제외 — 주간과 동일 규칙
  function _buildMonthPeriods() {
    const periods = [];
    for (let i = 12; i >= 1; i--) {
      const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      periods.push(`${y}-${m}`);
    }
    return periods;
  }

  // 12주 기간 키 배열 생성 (오래된 순, 가장 최근 = 지난 완료 주)
  function _buildWeekPeriods() {
    // 오늘 기준 이번 주 월요일
    const day = TODAY.getDay(); // 0=일,1=월..6=토
    const daysToMon = day === 0 ? 6 : day - 1;
    const thisMon = new Date(TODAY);
    thisMon.setDate(TODAY.getDate() - daysToMon);

    const periods = [];
    // 지난 12주 (이번 주 제외, 즉 11주 전 ~ 1주 전)
    for (let i = 12; i >= 1; i--) {
      const mon = new Date(thisMon);
      mon.setDate(thisMon.getDate() - i * 7);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      const fmt = d =>
        `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      periods.push(`${fmt(mon)}~${fmt(sun)}`);
    }
    return periods;
  }

  // 구별 월별 시계열 (아파트/비아파트) — 목데이터용
  function _districtMonthlySeq(district) {
    return _buildMonthPeriods().map((_, idx) => {
      const m = _monthMultiplier(idx);
      return {
        apt:    Math.max(5, Math.floor(baseAptData[district]    * m.apt)),
        nonApt: Math.max(5, Math.floor(baseNonAptData[district] * m.nonApt))
      };
    });
  }

  // 구별 주별 시계열 — 목데이터용
  function _districtWeeklySeq(district) {
    const monthSeqs = _districtMonthlySeq(district);
    // 최근 월 값을 1/4.3 스케일로 축소하여 주간값 산출
    const latestMonthApt    = monthSeqs[11].apt;
    const latestMonthNonApt = monthSeqs[11].nonApt;
    return _buildWeekPeriods().map((_, idx) => {
      const v = _weekVariation(idx);
      return {
        apt:    Math.max(5, Math.floor(latestMonthApt    / 4.3 * v)),
        nonApt: Math.max(5, Math.floor(latestMonthNonApt / 4.3 * v))
      };
    });
  }

  // ── 목데이터를 정규화 구조로 변환 ─────────────────
  // 실데이터와 동일한 형태로 빌드하여 공통 접근 경로 사용
  function _buildMockNormalized() {
    const weekPeriods  = _buildWeekPeriods();
    const monthPeriods = _buildMonthPeriods();
    const byDistrict = {};
    for (const d of DISTRICTS) {
      byDistrict[d] = {
        week:  _districtWeeklySeq(d),
        month: _districtMonthlySeq(d)
      };
    }
    return { periods: { week: weekPeriods, month: monthPeriods }, byDistrict };
  }

  // ── 통합 정규화 데이터 (실 또는 목) ───────────────
  const DATA = IS_REAL
    ? { periods: RAW.periods, byDistrict: RAW.byDistrict }
    : _buildMockNormalized();

  // ── 공개 인터페이스 ──────────────────────────────
  return {
    /** 기간 키 배열 반환 (granularity: 'week'|'month') */
    getPeriods(granularity) {
      return DATA.periods[granularity];
    },

    /** 특정 기간의 25개구 총계 {district, apt, nonApt} 배열 */
    getDistrictTotals(granularity, periodKey) {
      const periods = DATA.periods[granularity];
      const idx = periods.indexOf(periodKey);
      return DISTRICTS.map(d => {
        const seq = DATA.byDistrict[d][granularity];
        const v = idx >= 0 ? seq[idx] : seq[seq.length - 1];
        return { district: d, apt: v.apt, nonApt: v.nonApt };
      });
    },

    /** 특정 구의 전체 기간 시계열 [{apt, nonApt}, ...] */
    getDistrictTrend(district, granularity) {
      return DATA.byDistrict[district][granularity];
    },

    /** 서울 전체 합계 {apt, nonApt} */
    getSeoulTotals(granularity, periodKey) {
      const rows = this.getDistrictTotals(granularity, periodKey);
      return rows.reduce(
        (acc, r) => ({ apt: acc.apt + r.apt, nonApt: acc.nonApt + r.nonApt }),
        { apt: 0, nonApt: 0 }
      );
    },

    /** 특정 구·기간의 공간규격·금액대 분류 {room:{studio,two,three}, price:{under3,under6,over6}} */
    getDistrictBreakdown(granularity, district, periodKey) {
      const periods = DATA.periods[granularity];
      const idx = periods.indexOf(periodKey);
      const seq = DATA.byDistrict[district][granularity];
      const entry = idx >= 0 ? seq[idx] : seq[seq.length - 1];

      // 실데이터: room/price 필드 직접 읽기
      if (entry.room && entry.price) {
        return { room: entry.room, price: entry.price };
      }

      // 목데이터 폴백: nonApt 기반 균등 분할 추정
      const nonApt = entry.nonApt;
      const total  = entry.apt + nonApt;
      const base3  = Math.floor(total / 3);
      return {
        room:  { studio: base3, two: base3, three: total - base3 * 2 },
        price: {
          under3: Math.floor(nonApt * 0.45),
          under6: Math.floor(nonApt * 0.40),
          over6:  nonApt - Math.floor(nonApt * 0.45) - Math.floor(nonApt * 0.40)
        }
      };
    }
  };
})();

// ════════════════════════════════════════════════
//  한국어 조사 헬퍼
//  받침 여부: (코드포인트 - 0xAC00) % 28 !== 0 이면 받침 있음
// ════════════════════════════════════════════════
function hasBatchim(word) {
  const code = word.charCodeAt(word.length - 1);
  if (code < 0xAC00 || code > 0xD7A3) return false; // 한글 범위 밖
  return (code - 0xAC00) % 28 !== 0;
}
// josa('강남구', '은/는') → '는'  /  josa('강동구', '이/가') → '가'
function josa(word, pair) {
  const [withBatchim, withoutBatchim] = pair.split('/');
  return hasBatchim(word) ? withBatchim : withoutBatchim;
}

// ════════════════════════════════════════════════
//  헬퍼
// ════════════════════════════════════════════════
function formatPeriodLabel(key, gran) {
  if (gran === 'month') {
    const [y, m] = key.split('-');
    return `${y}년 ${parseInt(m)}월`;
  }
  const parts = key.split('~');
  return `${parts[0]} ~ ${parts[1].slice(5)}`;
}

function deltaPct(curr, prev) {
  if (prev == null || prev === 0) return null;
  return parseFloat(((curr - prev) / prev * 100).toFixed(1));
}

function renderDelta(elementId, curr, prev) {
  const el = document.getElementById(elementId);
  const pct = deltaPct(curr, prev);
  if (pct === null) { el.textContent = '—'; el.className = 'text-xs mt-1 font-semibold text-slate-500'; return; }
  if (pct > 0) {
    el.textContent = `▲ ${pct}%`;
    el.className = 'text-xs mt-1 font-semibold text-red-600';
  } else if (pct < 0) {
    el.textContent = `▼ ${Math.abs(pct)}%`;
    el.className = 'text-xs mt-1 font-semibold text-blue-600';
  } else {
    el.textContent = '— 0%';
    el.className = 'text-xs mt-1 font-semibold text-slate-500';
  }
}

function periodShortLabel(key, gran) {
  if (gran === 'month') {
    const [y, m] = key.split('-');
    return `${y.slice(2)}.${m}`;
  }
  return key.split('~')[0].slice(5); // "06-29"
}

// A. KPI 카드 — 선택 구 기준
function renderKPI() {
  const periodKey     = periods[periodIndex];
  const prevPeriodKey = periodIndex > 0 ? periods[periodIndex - 1] : null;

  const rows     = dataProvider.getDistrictTotals(granularity, periodKey);
  const distRow  = rows.find(r => r.district === selectedDistrict) || { apt: 0, nonApt: 0 };

  let prevApt = null, prevNonApt = null;
  if (prevPeriodKey) {
    const prevRows = dataProvider.getDistrictTotals(granularity, prevPeriodKey);
    const prevRow  = prevRows.find(r => r.district === selectedDistrict);
    if (prevRow) { prevApt = prevRow.apt; prevNonApt = prevRow.nonApt; }
  }

  document.getElementById('kpiDistrictLabel').textContent  = selectedDistrict;
  document.getElementById('kpiDistrictLabel2').textContent = selectedDistrict;
  document.getElementById('kpiApt').textContent            = distRow.apt.toLocaleString();
  document.getElementById('kpiNon').textContent            = distRow.nonApt.toLocaleString();
  renderDelta('kpiAptDelta', distRow.apt,    prevApt);
  renderDelta('kpiNonDelta', distRow.nonApt, prevNonApt);
}

// B. 카토그램
function renderCartogram() {
  const map       = document.getElementById('cartogramMap');
  const periodKey = periods[periodIndex];
  const rows      = dataProvider.getDistrictTotals(granularity, periodKey);

  // 총량으로 tier 계산
  const sorted = [...rows].sort((a, b) => (b.apt + b.nonApt) - (a.apt + a.nonApt));
  const highThreshold = (sorted[7]?.apt  || 0) + (sorted[7]?.nonApt  || 0);
  const midThreshold  = (sorted[15]?.apt || 0) + (sorted[15]?.nonApt || 0);
  const totalsMap = {};
  rows.forEach(r => { totalsMap[r.district] = r.apt + r.nonApt; });

  map.innerHTML = '';
  cartogramLayout.forEach(row => {
    row.forEach(cell => {
      const div = document.createElement('div');
      if (!cell) {
        div.className = 'h-12';
        div.setAttribute('aria-hidden', 'true');
      } else {
        const total = totalsMap[cell] || 0;
        const isSelected = cell === selectedDistrict;
        let bg = 'bg-slate-100 text-slate-600 border-slate-200';
        if (total >= highThreshold) bg = 'bg-indigo-600 text-white border-indigo-500';
        else if (total >= midThreshold) bg = 'bg-indigo-200 text-indigo-900 border-indigo-300';
        const ring = isSelected ? ' ring-2 ring-amber-400 ring-offset-1' : '';
        div.className = `h-12 rounded-lg border flex flex-col justify-center items-center cursor-pointer transition-colors hover:opacity-80 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-1 ${bg}${ring} p-0.5`;
        div.setAttribute('role', 'button');
        div.setAttribute('tabindex', '0');
        div.setAttribute('aria-label', `${cell} ${total}건${isSelected ? ' (선택됨)' : ''}`);
        div.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        div.innerHTML = `<span class="text-[10px] font-bold leading-tight" aria-hidden="true">${cell.replace('구','')}</span><span class="text-[9px] leading-tight" aria-hidden="true">${total}건</span>`;
        div.onclick = () => selectDistrict(cell);
        div.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectDistrict(cell); } };
      }
      map.appendChild(div);
    });
  });
}

// D. 분석 코멘터리 (팩트 전용 — 해석/예측 금지)
function renderCommentary() {
  const periodKey     = periods[periodIndex];
  const prevPeriodKey = periodIndex > 0 ? periods[periodIndex - 1] : null;
  const granWord      = granularity === 'week' ? '주' : '달';
  const prevWord      = granularity === 'week' ? '전주' : '전월';

  // 서울 전체 집계
  const seoulCurr = dataProvider.getSeoulTotals(granularity, periodKey);
  const seoulPrev = prevPeriodKey ? dataProvider.getSeoulTotals(granularity, prevPeriodKey) : null;

  // 전기 대비 아파트 변화율 (periodIndex > 0 일 때만)
  let deltaClause = '';
  if (seoulPrev) {
    const pct = deltaPct(seoulCurr.apt, seoulPrev.apt);
    if (pct !== null) {
      const sign = pct > 0 ? '+' : '';
      deltaClause = `, ${prevWord} 대비 아파트 ${sign}${pct}%`;
    }
  }

  // 이번 기간 거래량 최다 구
  const rows = dataProvider.getDistrictTotals(granularity, periodKey);
  const topRow = [...rows].sort((a, b) => (b.apt + b.nonApt) - (a.apt + a.nonApt))[0];
  const topCount = topRow ? (topRow.apt + topRow.nonApt) : 0;

  // 선택 구 데이터
  const distRow = rows.find(r => r.district === selectedDistrict) || { apt: 0, nonApt: 0 };
  const distTotal = distRow.apt + distRow.nonApt;
  const nonAptPct = distTotal > 0 ? ((distRow.nonApt / distTotal) * 100).toFixed(1) : '0.0';

  const bd = dataProvider.getDistrictBreakdown(granularity, selectedDistrict, periodKey);

  // 최다 공간규격
  const roomEntries = [['원룸형', bd.room.studio], ['투룸형', bd.room.two], ['쓰리룸+', bd.room.three]];
  roomEntries.sort((a, b) => b[1] - a[1]);
  const topRoom = roomEntries[0][0];

  // 비아파트 최다 금액대
  const priceEntries = [['3억 이하', bd.price.under3], ['3~6억', bd.price.under6], ['6억 초과', bd.price.over6]];
  priceEntries.sort((a, b) => b[1] - a[1]);
  const topPrice = priceEntries[0][0];

  const eun = josa(selectedDistrict, '은/는');

  let text =
    `이번 ${granWord} 서울 아파트 거래 ${seoulCurr.apt.toLocaleString()}건, 비아파트 ${seoulCurr.nonApt.toLocaleString()}건${deltaClause}. ` +
    `최다 거래 구: ${topRow ? topRow.district : '—'}(${topCount.toLocaleString()}건). ` +
    `${selectedDistrict}${eun} 아파트 ${distRow.apt.toLocaleString()}건 · 비아파트 ${distRow.nonApt.toLocaleString()}건 (비아파트 ${nonAptPct}%). ` +
    `최다 공간규격 ${topRoom}, 비아파트 최다 금액대 ${topPrice}.`;

  if (periodIndex === periods.length - 1) {
    text += ' ※ 최신 기간은 신고 진행 중이라 확정치가 아닙니다.';
  }

  document.getElementById('commentary').textContent = text;
}

  if (barChartInst) {
    barChartInst.data.labels = labels;
    barChartInst.data.datasets[0].data = aptVals;
    barChartInst.data.datasets[0].backgroundColor = config.data.datasets[0].backgroundColor;
    barChartInst.data.datasets[0].borderColor = config.data.datasets[0].borderColor;
    barChartInst.data.datasets[0].borderWidth = config.data.datasets[0].borderWidth;
    barChartInst.data.datasets[1].data = nonAptVals;
    barChartInst.data.datasets[1].backgroundColor = config.data.datasets[1].backgroundColor;
    barChartInst.data.datasets[1].borderColor = config.data.datasets[1].borderColor;
    barChartInst.data.datasets[1].borderWidth = config.data.datasets[1].borderWidth;
    barChartInst.update();
  } else {
    barChartInst = new Chart(document.getElementById('barChart'), config);
  }
}

function renderAll() {
  renderKPI();
  renderCartogram();
  renderBarChart();
  renderDistrictChart();
  renderCommentary();
  renderNavigation();
}

// ════════════════════════════════════════════════
//  차트 모드 스위치
// ════════════════════════════════════════════════
function switchChartMode(mode) {
  chartMode = mode;
  ['trend','room','price'].forEach(m => {
    const btn = document.getElementById(`chartTab-${m}`);
    const active = m === mode;
    btn.className = active
      ? 'px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400'
      : 'px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400';
    btn.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  renderDistrictChart();
}

// ════════════════════════════════════════════════
//  자동재생
// ════════════════════════════════════════════════
function stopAutoplay() {
  if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  isPlaying = false;
  document.getElementById('playIcon').textContent = '▶';
  document.getElementById('playText').textContent = '재생';
  const btn = document.getElementById('playBtn');
  btn.className = 'flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-white rounded-lg text-xs font-bold transition-colors';
  btn.setAttribute('aria-pressed', 'false');
}

function toggleAutoplay() {
  if (isPlaying) {
    stopAutoplay();
  } else {
    isPlaying = true;
    document.getElementById('playIcon').textContent = '⏸';
    document.getElementById('playText').textContent = '정지';
    const btn = document.getElementById('playBtn');
    btn.className = 'flex items-center gap-1.5 px-3 py-1.5 bg-amber-500 hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400 text-white rounded-lg text-xs font-bold transition-colors';
    btn.setAttribute('aria-pressed', 'true');
    autoplayTimer = setInterval(() => {
      if (periodIndex >= periods.length - 1) { stopAutoplay(); return; }
      periodIndex += 1;
      renderAll();
    }, 1500);
  }
}

// ════════════════════════════════════════════════
//  이벤트 핸들러
// ════════════════════════════════════════════════
document.getElementById('timeSlider').addEventListener('input', e => {
  stopAutoplay();
  periodIndex = parseInt(e.target.value);
  renderAll();
});

function setGranularity(gran) {
  granularity = gran;
  periods     = dataProvider.getPeriods(gran);
  periodIndex = periods.length - 1;

  const wBtn = document.getElementById('btnWeek');
  const mBtn = document.getElementById('btnMonth');
  if (gran === 'week') {
    wBtn.className = 'px-3 py-1.5 rounded-md text-sm font-semibold transition-colors bg-indigo-600 text-white';
    mBtn.className = 'px-3 py-1.5 rounded-md text-sm font-semibold transition-colors text-slate-600 hover:text-slate-900';
  } else {
    mBtn.className = 'px-3 py-1.5 rounded-md text-sm font-semibold transition-colors bg-indigo-600 text-white';
    wBtn.className = 'px-3 py-1.5 rounded-md text-sm font-semibold transition-colors text-slate-600 hover:text-slate-900';
  }
  stopAutoplay();
  renderAll();
}

function navigate(dir) {
  const newIdx = periodIndex + dir;
  if (newIdx < 0 || newIdx >= periods.length) return;
  periodIndex = newIdx;
  renderAll();
}

function selectDistrict(district) {
  selectedDistrict = district;
  renderAll();
}

// ════════════════════════════════════════════════
//  초기화
// ════════════════════════════════════════════════
setGranularity('week');
</script>
