# 품질 게이트 — 러너에서 npm run verify(puppeteer)가 실제로 도는지 보장한다.
#
# 이게 러너에서 통과하지 못하면 Stop 훅의 검증도 러너에서 무의미하다.
# 그래서 에이전트 워크플로와 별개로 독립 실행할 수 있게 두고, PR 에도 붙인다.
name: 품질 게이트

on:
  # 에이전트 브랜치 검증은 claude.yml 안에서 한다 — 에이전트의 push 는
  # github-actions[bot] 이름으로 나가 push 트리거를 발동시키지 않는다(실측).
  # 여기서는 사람이 여는 PR 과 수동 실행만 받는다.
  pull_request:
    paths:
      - 'dashboard/dashboard.html'
      - 'dashboard/data.js'
      - 'dashboard/verify-quality.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # 로컬과 맞춘다(로컬 v25.1.0). 메이저를 고정하고 패치는 러너에 맡긴다.
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm

      # puppeteer 가 postinstall 에서 Chrome for Testing 을 내려받는다.
      # 러너에 크롬이 기본 설치돼 있지 않으므로 이 단계가 곧 크롬 설치다.
      - name: 의존성 설치 (puppeteer + Chrome)
        run: npm ci

      # Ubuntu 23.10+ 는 AppArmor 로 비특권 user namespace 를 막아 크롬 샌드박스가 뜨지 않는다.
      # 제품 코드에 --no-sandbox 를 넣는 대신 러너 쪽 제한을 푼다 —
      # 그래야 로컬과 CI 가 같은 조건에서 같은 게이트를 돈다.
      - name: 크롬 샌드박스 허용 (AppArmor 제한 해제)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # puppeteer 25 의 executablePath() 는 Promise 를 반환한다 — await 해야 경로가 나온다.
      - name: 크롬 실제 존재 확인
        run: |
          node -e "
          const p = require('puppeteer');
          const fs = require('node:fs');
          (async () => {
            const ep = await p.executablePath();
            console.log('executablePath:', ep);
            fs.accessSync(ep, fs.constants.X_OK);
            console.log('실행 가능 확인 완료');
          })().catch(e => { console.error('크롬 실행파일 확인 실패:', e.message); process.exit(1); });
          "

      - name: 품질 게이트 실행
        run: npm run verify
