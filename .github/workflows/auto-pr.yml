# 에이전트 브랜치 → Draft PR (백스톱)
#
# 주 경로는 claude.yml 안의 "Draft PR 생성" 단계다. 에이전트의 push 는
# github-actions[bot](41898282) 이름으로 나가고, GitHub 은 그 봇이 만든
# 이벤트로 워크플로를 트리거하지 않는다 — 즉 아래 push 트리거는
# **에이전트가 만든 브랜치에는 발동하지 않는다.** 실측으로 확인했다.
#
# 그래서 이 워크플로는 백스톱이다:
#   - 사람이 claude/** 브랜치를 직접 push 한 경우
#   - 주 경로가 실패해 PR 이 안 열렸을 때 수동 실행(workflow_dispatch)
#
# 중복 생성은 open-draft-pr.sh 가 막는다(열린 PR 이 있으면 만들지 않는다).
name: 에이전트 브랜치 Draft PR (백스톱)

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'PR 을 열 브랜치 (예: claude/issue-1-20260813-0756)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.event.inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  open-draft-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Draft PR 생성 (없을 때만)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: bash .github/scripts/open-draft-pr.sh
