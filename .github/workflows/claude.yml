# 에이전트 — 이슈·PR 코멘트에 @claude 를 언급하면 조사·구현해서 PR 을 올린다.
#
# 인증은 ANTHROPIC_API_KEY 시크릿(콘솔 API 키)을 쓴다.
# 구독 계정 OAuth 토큰(sk-ant-oat…)은 CI 에서 거부되는 사례가 많아 쓰지 않는다.
#
# 방어선: 이 저장소의 .claude/settings.json 이 프로젝트 설정으로 자동 로드되므로
# 훅 3개(block-secrets / guard-destructive / verify-gate)가 러너에서도 걸린다.
# 비공개 저장소는 GitHub 시크릿 스캐닝이 유료라 이 훅이 유일한 자동 방어선이다.
name: 에이전트

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # 러너를 띄우기 전에 @claude 언급 여부를 먼저 거른다.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    # 실행 상한. 폭주하면 여기서 끊긴다.
    timeout-minutes: 30

    # 이슈를 여러 개 던져도 같은 이슈/PR 에 대해서는 하나씩 처리한다.
    # 진행 중인 작업은 취소하지 않는다 — 반쯤 만든 PR 을 남기지 않기 위해.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    permissions:
      contents: write        # 브랜치 생성·커밋
      pull-requests: write   # PR 생성
      issues: write          # 이슈에 진행 상황 코멘트
      id-token: write        # 액션의 기본 GitHub App 인증에 필요
      actions: read          # PR 의 CI 결과를 읽기 위해

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 에이전트가 검증(npm run verify)을 돌릴 수 있어야 한다.
      # verify.yml 과 같은 구성 — 러너에 크롬이 기본 설치돼 있지 않으므로
      # npm ci 로 puppeteer 가 Chrome for Testing 을 내려받게 한다.
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm

      - name: 의존성 설치 (puppeteer + Chrome)
        run: npm ci

      # Ubuntu 23.10+ 는 AppArmor 로 비특권 user namespace 를 막아 크롬 샌드박스가 뜨지 않는다.
      # 제품 코드에 --no-sandbox 를 넣는 대신 러너 쪽 제한을 푼다 —
      # 그래야 로컬과 CI 가 같은 조건에서 같은 게이트를 돈다.
      - name: 크롬 샌드박스 허용 (AppArmor 제한 해제)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: 에이전트 실행
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CI 전용 설정. 로컬 .claude/settings.json 의 ask 규칙은 CI 에서
          # 물어볼 사람이 없어 곧 거부가 된다. 훅 3개는 이 파일에도 그대로 실려
          # 방어선은 유지된다.
          settings: .github/claude-ci-settings.json
          # 진단용 — 원인이 잡히면 뺀다.
          show_full_output: true
          claude_args: |
            --max-turns 30
            --model claude-sonnet-5

      # ── 에이전트 이후 (전부 셸 단계 — 에이전트의 도구 선택에 의존하지 않는다) ──
      #
      # 에이전트의 push 는 github-actions[bot](41898282) 이름으로 나간다.
      # GitHub 은 이 봇이 만든 이벤트로 워크플로를 트리거하지 않으므로
      # 브랜치 push 에 반응하는 별도 워크플로는 영영 돌지 않는다.
      # 그래서 검증과 PR 생성을 같은 잡에서 이어서 한다.
      # 에이전트가 실패로 끝나도(예: 턴 소진) 커밋·푸시는 이미 끝났을 수 있다.
      # 그 경우 브랜치는 올라가 있으므로 PR 은 만들어져야 한다.
      # !cancelled() — 성공·실패 모두 돌되 잡이 취소되면 건너뛴다.
      # 브랜치가 아예 없으면 아래 found=false 로 다음 단계들이 걸러진다.
      - name: 에이전트 브랜치 확인
        id: branch
        if: ${{ !cancelled() }}
        env:
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -uo pipefail
          git fetch -q origin "+refs/heads/claude/*:refs/remotes/origin/claude/*" || true
          BR=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' \
                 "refs/remotes/origin/claude/issue-${ISSUE}-*" 2>/dev/null | head -1 | sed 's|^origin/||')
          if [ -z "${BR:-}" ]; then
            echo "에이전트가 만든 브랜치가 없다 — 코드 변경 없는 응답이었을 수 있다"
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AHEAD=$(git rev-list --count "origin/main..origin/$BR")
          [ "$AHEAD" -eq 0 ] && { echo "main 대비 커밋 없음"; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if git diff --quiet "origin/main..origin/$BR" -- \
               dashboard/dashboard.html dashboard/data.js dashboard/verify-quality.mjs; then
            NEEDS_VERIFY=false
          else
            NEEDS_VERIFY=true
          fi
          echo "브랜치: $BR (커밋 ${AHEAD}개, 품질게이트 필요=$NEEDS_VERIFY)"
          {
            echo "found=true"
            echo "name=$BR"
            echo "needs_verify=$NEEDS_VERIFY"
          } >> "$GITHUB_OUTPUT"

      # 화면·데이터가 바뀐 경우에만 브라우저를 띄운다. 문서만 바뀌면 건너뛴다.
      # 게이트가 실패해도 PR 은 연다 — 실패한 채로 보이는 편이 침묵보다 낫다.
      # 결과는 PR 본문에 적힌다.
      - name: 품질 게이트 (에이전트 브랜치)
        id: verify
        continue-on-error: true
        if: ${{ !cancelled() && steps.branch.outputs.found == 'true' && steps.branch.outputs.needs_verify == 'true' }}
        run: |
          set -eu
          git checkout -q "origin/${{ steps.branch.outputs.name }}"
          npm run verify

      - name: Draft PR 생성
        if: ${{ !cancelled() && steps.branch.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          AGENT_RESULT: ${{ steps.agent.outcome }}
        run: bash .github/scripts/open-draft-pr.sh
